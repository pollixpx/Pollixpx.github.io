<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stripe Dark Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              gray: {
                850: '#1f2937',
                950: '#0b0f19',
              }
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Babel for in-browser compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Custom scrollbar for dark theme */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0b0f19; }
      ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>

    <!-- Import Map: STRICTLY REACT 18 TO AVOID VERSION CONFLICTS -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@stripe/stripe-js": "https://esm.sh/@stripe/stripe-js@2.1.0",
    "@stripe/react-stripe-js": "https://esm.sh/@stripe/react-stripe-js@2.3.1?external=react,react-dom",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
  </head>
  <body class="bg-gray-950 text-gray-200 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root" class="h-screen w-full flex items-center justify-center text-gray-500">
      Loading payment system...
    </div>

    <!-- Error Handler -->
    <script>
      window.addEventListener('error', function(event) {
        const root = document.getElementById('root');
        if (root && root.innerText.includes('Loading')) {
          root.innerHTML = `
            <div style="color:#ef4444; padding:20px; background:#1f2937; border-radius:8px; max-width:600px; font-family:monospace; margin: 20px;">
              <strong style="font-size:1.2em">Application Error:</strong><br><br>
              ${event.message}<br><br>
              <em>Check the console for more details.</em>
            </div>`;
        }
      });
    </script>

    <!-- MAIN APPLICATION SCRIPT 
         Note: data-type="module" is CRITICAL for imports to work in Babel Standalone 
    -->
    <script type="text/babel" data-type="module" data-presets="react,typescript">
      import React, { useState } from 'react';
      import ReactDOM from 'react-dom/client';
      import { loadStripe } from '@stripe/stripe-js';
      import { Elements, CardElement, useStripe, useElements } from '@stripe/react-stripe-js';

      // --- SERVICES ---
      const STRIPE_PUBLIC_KEY = 'pk_test_TYooMQauvdEDq54NiTphI7jx';
      const stripePromise = loadStripe(STRIPE_PUBLIC_KEY);

      // --- STYLES ---
      const CARD_ELEMENT_OPTIONS = {
        style: {
          base: {
            color: '#e2e8f0', // slate-200
            fontFamily: '"Inter", sans-serif',
            fontSmoothing: 'antialiased',
            fontSize: '16px',
            '::placeholder': { color: '#64748b' },
            iconColor: '#6366f1', // indigo-500
          },
          invalid: {
            color: '#ef4444', // red-500
            iconColor: '#ef4444',
          },
        },
        hidePostalCode: true,
      };

      // --- COMPONENT: CheckoutForm ---
      const CheckoutForm = () => {
        const stripe = useStripe();
        const elements = useElements();
        const [error, setError] = useState(null);
        const [success, setSuccess] = useState(false);
        const [loading, setLoading] = useState(false);

        const handleSubmit = async (event) => {
          event.preventDefault();
          if (!stripe || !elements) return;

          setLoading(true);
          setError(null);
          setSuccess(false);

          const cardElement = elements.getElement(CardElement);
          if (!cardElement) {
             setLoading(false);
             return;
          }

          // Create PaymentMethod
          const { error: stripeError, paymentMethod } = await stripe.createPaymentMethod({
            type: 'card',
            card: cardElement,
          });

          if (stripeError) {
            setError(stripeError.message || 'An unexpected error occurred.');
            setLoading(false);
          } else {
            console.log('[PaymentMethod]', paymentMethod);
            setSuccess(true);
            setLoading(false);
          }
        };

        return (
          <form onSubmit={handleSubmit} className="w-full space-y-6">
            <div className="space-y-2">
              <label htmlFor="card-element" className="block text-sm font-medium text-gray-400">
                Card Details
              </label>
              <div className="p-4 rounded-lg bg-gray-900 border border-gray-800 focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-transparent transition-all duration-200">
                <CardElement id="card-element" options={CARD_ELEMENT_OPTIONS} onChange={() => setError(null)} />
              </div>
            </div>

            {error && (
              <div className="flex items-center space-x-2 text-red-400 text-sm bg-red-400/10 p-3 rounded-md animate-pulse">
                <svg className="h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd" /></svg>
                <span>{error}</span>
              </div>
            )}

            {success && (
              <div className="flex items-center space-x-2 text-green-400 text-sm bg-green-400/10 p-3 rounded-md">
                <svg className="h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" /></svg>
                <span>Payment details verified successfully!</span>
              </div>
            )}

            <button
              type="submit"
              disabled={!stripe || loading || success}
              className={`w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-indigo-500 transition-all duration-200 ${
                (loading || success) ? 'opacity-75 cursor-not-allowed' : ''
              }`}
            >
              {loading ? (
                <span className="flex items-center">
                  <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                  Processing...
                </span>
              ) : success ? 'Success' : 'Verificar Tarjeta'}
            </button>
            
            <p className="text-xs text-center text-gray-500 mt-4">
              Powered by <span className="font-bold text-gray-400">Stripe</span>. 
              <br/> 
              Use <span className="font-mono text-indigo-400">4242 4242 4242 4242</span> to test.
            </p>
          </form>
        );
      };

      // --- COMPONENT: App ---
      const App = () => {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
            <div className="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
              
              {/* Left Column: Product Info & Form */}
              <div className="bg-gray-900/50 backdrop-blur-sm p-8 rounded-2xl border border-gray-800 shadow-2xl">
                <div className="mb-8">
                  <span className="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-400 mb-3 border border-indigo-500/20">
                    Checkout Demo
                  </span>
                  <h1 className="text-3xl font-bold text-white mb-2 tracking-tight">Pro Plan Subscription</h1>
                  <p className="text-gray-400">Unlimited access to all premium features.</p>
                  <div className="mt-6 flex items-baseline">
                    <span className="text-4xl font-extrabold text-white">$0.10</span>
                    <span className="ml-2 text-lg text-gray-500">/verificación</span>
                  </div>
                </div>

                <Elements stripe={stripePromise}>
                  <CheckoutForm />
                </Elements>
              </div>

              {/* Right Column: Technical Explanation */}
              <div className="space-y-8 lg:mt-8">
                <div>
                  <h2 className="text-xl font-semibold text-white mb-4 flex items-center">
                    <svg className="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    How it works
                  </h2>
                  <div className="bg-gray-900 rounded-xl p-6 border border-gray-800 text-sm leading-relaxed text-gray-400">
                    <p className="mb-4">
                      This is a frontend-only demo using Stripe's <strong>Card Element</strong>. 
                      It securely collects card details and generates a token (or PaymentMethod) client-side.
                    </p>
                    <p>
                      To actually charge the card, you need a backend. The client cannot charge cards directly for security reasons.
                    </p>
                  </div>
                </div>

                <div>
                  <h2 className="text-xl font-semibold text-white mb-4 flex items-center">
                    <svg className="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
                    Backend Integration Guide
                  </h2>
                  <ul className="space-y-4">
                    <li className="flex gap-3">
                      <div className="flex-shrink-0 w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-indigo-400 font-bold text-sm border border-gray-700">1</div>
                      <div>
                        <h3 className="text-white font-medium">Create PaymentIntent</h3>
                        <p className="text-gray-500 text-sm mt-1">
                          Your backend calls <code>stripe.paymentIntents.create</code>.
                        </p>
                      </div>
                    </li>
                    <li className="flex gap-3">
                      <div className="flex-shrink-0 w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-indigo-400 font-bold text-sm border border-gray-700">2</div>
                      <div>
                        <h3 className="text-white font-medium">Send Client Secret</h3>
                        <p className="text-gray-500 text-sm mt-1">
                          The backend returns the <code>client_secret</code>.
                        </p>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // --- MOUNT ---
      const rootElement = document.getElementById('root');
      if (!rootElement) throw new Error("Could not find root element");
      
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
